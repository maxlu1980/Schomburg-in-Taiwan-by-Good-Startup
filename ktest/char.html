<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mira character test</title>
<style>html,body{margin:0;height:100%;background:#cfd6dc;overflow:hidden}canvas{display:block}</style></head><body>
<script src="../node_modules/three/build/three.min.js"></script>
<script src="../src/koeln/lib/KIT.js"></script><script src="../src/koeln/lib/LUNA.js"></script><script src="../src/koeln/lib/PROPS.js"></script><script src="../src/koeln/lib/DOG.js"></script>
<script>
(function () {
  var W = innerWidth, H = innerHeight, R3 = new THREE.WebGLRenderer({ antialias: true }); R3.setPixelRatio(window.CH_DPR || 1); R3.setSize(W, H); R3.shadowMap.enabled = true; R3.shadowMap.type = THREE.PCFSoftShadowMap; R3.outputEncoding = THREE.sRGBEncoding; R3.toneMapping = THREE.ACESFilmicToneMapping; R3.toneMappingExposure = window.CH_EXPO || 0.6; document.body.appendChild(R3.domElement);
  var scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfd6dc);
  var hemi = new THREE.HemisphereLight(0xbfe2f8, 0x80905e, 0.5); scene.add(hemi); var sun = new THREE.DirectionalLight(0xfff8ec, 1.7); sun.position.set(2.5, 5, 3.5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = -2; sun.shadow.camera.right = 2; sun.shadow.camera.top = 2; sun.shadow.camera.bottom = -2; sun.shadow.bias = -0.0005; scene.add(sun);
  var gr = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshLambertMaterial({ color: 0x8f8a82 })); gr.rotation.x = -Math.PI / 2; gr.receiveShadow = true; scene.add(gr);
  var cam = new THREE.PerspectiveCamera(30, W / H, 0.02, 100);
  LUNA.setQuality(window.CH_Q == null ? 3 : window.CH_Q); var A = LUNA.build('luna', { mira: true }); A.root.scale.setScalar(1.32 / 1.32); scene.add(A.root);
  var D = null; try { D = DOG.build(window.CH_DOG || 'shepherd'); D.root.position.set(0.75, 0, 0.2); scene.add(D.root); } catch (e) { window.__dogErr = String(e.stack || e); }
  function step(n, dt, o) { o = o || {}; for (var i = 0; i < n; i++) { if (o.move) { A.root.position.z += (A.speed || 0) * dt; if (D) D.root.position.z += (D.spd || 0) * dt; } LUNA.update(A, dt, o.lo || {}); if (D) DOG.update(D, dt, o.dogo || {}); } }
  function view(c, t, fov) { cam.fov = fov || 30; cam.updateProjectionMatrix(); cam.position.set(c[0], c[1], c[2]); cam.lookAt(t[0], t[1], t[2]); R3.render(scene, cam); }
  window.CH = { A: A, D: D, scene: scene, cam: cam, R3: R3, step: step, view: view, setMode: function (m, sp) { LUNA.setMode(A, m); A.speed = sp || 0; }, dog: function (m, sp) { if (!D) return; DOG.setMode(D, m); D.spd = sp || 0; },
    tris: function (o) { var n = 0; (o || A.root).traverse(function (x) { if (x.isMesh && x.geometry) { var g = x.geometry; n += g.index ? g.index.count / 3 : g.attributes.position.count / 3; } }); return Math.round(n); } };
  window.CH_READY = true;
})();
</script></body></html>
